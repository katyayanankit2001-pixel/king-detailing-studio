<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>King Detailing — Leads</title><style>body{margin:0;background:#0a0a09;color:#f4f1eb;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:48px 20px}h1{font-weight:500;letter-spacing:-.04em}input,button{padding:12px;background:#151513;color:#fff;border:1px solid #333}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:28px;font-size:13px}th,td{text-align:left;padding:12px;border-bottom:1px solid #222;vertical-align:top}th{color:#cbb78a;font-size:10px;text-transform:uppercase;letter-spacing:.14em}.status{color:#cbb78a}.muted{color:#888}</style></head><body><main><p class="muted">KING / DETAILING STUDIO</p><h1>Enquiries</h1><div><input id="token" type="password" placeholder="Admin token"><button id="load">Load leads</button></div><p id="msg" class="muted"></p><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Customer</th><th>Car</th><th>Service</th><th>Preferred</th><th>Status</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const token=document.getElementById('token'), rows=document.getElementById('rows'), msg=document.getElementById('msg');document.getElementById('load').onclick=async()=>{msg.textContent='Loading…';try{const r=await fetch('/api/admin/leads',{headers:{'x-admin-token':token.value}});const d=await r.json();if(!r.ok)throw Error(d.message);rows.innerHTML=(d.leads||[]).map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString()}</td><td>${x.name}<br><span class="muted">${x.phone}</span></td><td>${x.carBrand} ${x.carModel}</td><td>${x.service}</td><td>${x.date||'—'} ${x.time||''}</td><td class="status">${x.status}</td><td>${x.message||'—'}</td></tr>`).join('');msg.textContent=`${d.leads?.length||0} lead(s)`}catch(e){msg.textContent=e.message}}</script></body></html>
